<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Todo Dia</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Todo Dia">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fff7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1215" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<style>
:root{
  --bg:#fff7f9; --card:#ffffff; --ink:#2b1d22; --muted:#7a6a70;
  --rose:#d6336c; --rose-soft:#fde3ec; --rose-ink:#9c1f4d;
  --pause:#ece8ea; --pause-ink:#6b5f64; --ok:#2f9e6b; --warn:#e8590c;
  --line:#f0dde4; --field:#fff7f9; --bar:#d6336c; --grid:#f0e6ea; --shadow:0 1px 2px rgba(156,31,77,.06),0 6px 20px rgba(156,31,77,.06);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1b1215; --card:#261a1f; --ink:#f6eaee; --muted:#b9a5ad;
    --rose:#f06595; --rose-soft:#3d1f2b; --rose-ink:#ffc2d6;
    --pause:#332a2e; --pause-ink:#c9b9c0; --ok:#51cf9b; --warn:#ff922b;
    --line:#3a2a31; --field:#1f1519; --bar:#e64980; --grid:#3a2a31; --shadow:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:17px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;min-height:100dvh;overflow-x:hidden;
  padding:calc(env(safe-area-inset-top) + 12px) max(16px,env(safe-area-inset-right))
          calc(env(safe-area-inset-bottom) + 28px) max(16px,env(safe-area-inset-left))}
main{max-width:480px;margin:0 auto;display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.top{display:flex;align-items:center;gap:10px;padding:4px 2px 2px}
.top img{width:34px;height:34px;border-radius:9px}
h1{font-size:1.35rem;line-height:1.2;margin:0;color:var(--rose-ink);letter-spacing:-.01em}
h2{font-size:1.1rem;margin:0 0 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px 18px;
  box-shadow:var(--shadow);min-width:0}
.hero .label{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.hero .big{font-size:1.85rem;line-height:1.15;font-weight:750;margin:6px 0 6px;letter-spacing:-.01em}
.hero .sub{color:var(--muted);margin:0 0 16px}
.btn{appearance:none;-webkit-appearance:none;border:0;border-radius:14px;min-height:54px;padding:14px 18px;
  font:inherit;font-weight:700;background:var(--rose);color:#fff;width:100%;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;touch-action:manipulation}
.btn.ghost{background:transparent;color:var(--rose-ink);border:1px solid var(--line);font-weight:600}
.btn.small{width:auto;min-height:40px;padding:8px 14px;font-size:.9rem}
.btn:active{transform:scale(.985);opacity:.92}
.taken{display:flex;align-items:center;gap:10px;color:var(--ok);font-weight:700}
.banner{border-radius:14px;padding:12px 14px;background:var(--rose-soft);color:var(--rose-ink);font-weight:600}
.banner.warn{background:#fff0e6;color:#a8400a}
@media (prefers-color-scheme: dark){.banner.warn{background:#3b2414;color:#ffb27a}}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:12px}
.cell{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:.85rem;font-weight:600;border:2px solid transparent;position:relative;user-select:none;-webkit-user-select:none;min-width:0}
.cell.pill{background:var(--rose-soft);color:var(--rose-ink)}
.cell.pause{background:var(--pause);color:var(--pause-ink)}
.cell.done{background:var(--rose);color:#fff}
.cell.missed{border-color:var(--warn)}
.cell.today{border-color:var(--ink)}
.cell .mark{font-size:.7rem;line-height:1;height:.8rem}
.cell.tap{cursor:pointer}
.cell.tap:active{transform:scale(.94)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:.8rem;color:var(--muted);margin-top:12px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:4px;margin-right:5px;vertical-align:-1px}
.stat{display:flex;justify-content:space-between;color:var(--muted);font-size:.92rem;margin-top:14px;
  padding-top:12px;border-top:1px solid var(--line)}
label{display:block;font-weight:600;margin:16px 0 6px;line-height:1.3}
input[type=date],input[type=time],input[type=number]{
  -webkit-appearance:none;appearance:none;display:block;width:100%;max-width:100%;min-width:0;
  height:52px;margin:0;padding:0 14px;border-radius:12px;border:1px solid var(--line);
  background:var(--field);color:var(--ink);font:inherit;font-size:17px;text-align:left;line-height:52px}
input::-webkit-date-and-time-value{text-align:left;margin:0}
input::-webkit-datetime-edit{padding:0}
input:focus{outline:none;border-color:var(--rose);box-shadow:0 0 0 3px var(--rose-soft)}
details summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;
  align-items:center;min-height:28px}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"＋";color:var(--muted);margin-left:12px}
details[open] summary::after{content:"－"}
.note{color:var(--muted);font-size:.9rem;margin:8px 0 0}
.stack{display:grid;gap:10px;margin-top:18px}
.danger{color:#c92a2a;border-color:#f3c9c9}
@media (prefers-color-scheme: dark){.danger{color:#ff8787;border-color:#5c2a2a}}
.file{display:none}
.top .back{margin-left:auto}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow);min-width:0}
.tile .k{font-size:.8rem;color:var(--muted);line-height:1.25}
.tile .v{font-size:1.6rem;font-weight:700;line-height:1.15;margin-top:4px;font-variant-numeric:tabular-nums}
.tile .s{font-size:.8rem;color:var(--muted);margin-top:2px}
.hero-num{font-size:3rem;font-weight:700;line-height:1;margin:6px 0 4px;font-variant-numeric:tabular-nums}
.meter{height:10px;border-radius:6px;background:var(--rose-soft);overflow:hidden;margin-top:12px}
.meter i{display:block;height:100%;background:var(--bar);border-radius:6px}
.chart{display:block;width:100%;height:auto;margin-top:12px;overflow:visible}
.chart text{fill:var(--muted);font-size:11px;font-family:inherit}
.chart .hit{fill:transparent;cursor:pointer}
.chart .col{fill:var(--bar)}
.chart .col.cur{fill:var(--rose-soft);stroke:var(--bar);stroke-width:1.5}
.chart .col.sel{opacity:1}
.chart.has-sel .col:not(.sel){opacity:.45}
.readout{min-height:1.4em;font-size:.9rem;margin-top:8px;color:var(--ink);font-variant-numeric:tabular-nums}
table.t{width:100%;border-collapse:collapse;font-size:.88rem;margin-top:10px;font-variant-numeric:tabular-nums}
table.t th,table.t td{text-align:left;padding:8px 4px;border-bottom:1px solid var(--line)}
table.t th{color:var(--muted);font-weight:600}
table.t td:last-child,table.t th:last-child{text-align:right}
.open-stats{display:flex;align-items:center;justify-content:space-between;gap:12px;text-decoration:none;color:inherit;cursor:pointer}
.open-stats .arrow{color:var(--muted);font-size:1.3rem}
@media (max-width:360px){
  .card{padding:16px 14px}
  .grid{gap:4px}
  .cell{border-radius:10px;font-size:.78rem}
  .hero .big{font-size:1.6rem}
}
</style>
</head>
<body>
<main id="app"></main>

<script>
(function(){
  var KEY = 'pilula.v1', UIKEY = 'pilula.ui';
  var S = load();
  var UI = loadUI();

  function load(){ try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ return {}; } }
  function save(){
    S.saved = Date.now();
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){}
    idbPut(S);
  }

  // ---------- Cópia de segurança no IndexedDB ----------
  // O localStorage pode ser apagado pelo sistema depois de um tempo sem uso.
  // Guardamos uma segunda cópia no IndexedDB e recuperamos dela se precisar.
  function idb(cb){
    try {
      var r = indexedDB.open('todo-dia', 1);
      r.onupgradeneeded = function(){ r.result.createObjectStore('kv'); };
      r.onsuccess = function(){ cb(r.result); };
      r.onerror = function(){ cb(null); };
    } catch(e){ cb(null); }
  }
  function idbPut(v){
    idb(function(db){
      if (!db) return;
      try { db.transaction('kv','readwrite').objectStore('kv').put(JSON.stringify(v), KEY); } catch(e){}
    });
  }
  function idbGet(cb){
    idb(function(db){
      if (!db) return cb(null);
      try {
        var q = db.transaction('kv').objectStore('kv').get(KEY);
        q.onsuccess = function(){ try { cb(JSON.parse(q.result)); } catch(e){ cb(null); } };
        q.onerror = function(){ cb(null); };
      } catch(e){ cb(null); }
    });
  }

  // ---------- Onde a pessoa parou (seções abertas, rolagem, rascunho) ----------
  function loadUI(){ try { return JSON.parse(localStorage.getItem(UIKEY)) || {}; } catch(e){ return {}; } }
  function saveUI(){ try { localStorage.setItem(UIKEY, JSON.stringify(UI)); } catch(e){} }
  function captureUI(){
    var open = [], ds = document.querySelectorAll('details[id]');
    for (var i=0;i<ds.length;i++) if (ds[i].open) open.push(ds[i].id);
    if (ds.length) UI.open = open;
    UI.scroll = window.scrollY || 0;
  }
  function restoreUI(){
    var open = UI.open || [];
    for (var i=0;i<open.length;i++){ var d = document.getElementById(open[i]); if (d) d.open = true; }
    var ds = document.querySelectorAll('details[id]');
    for (var j=0;j<ds.length;j++) ds[j].addEventListener('toggle', function(){ captureUI(); saveUI(); });
  }

  function pad(n){ return String(n).padStart(2,'0'); }
  function ymd(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function parse(s){ var p=s.split('-').map(Number); return new Date(p[0],p[1]-1,p[2]); }
  function addDays(d,n){ return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n); }
  function diffDays(a,b){
    return Math.round((Date.UTC(b.getFullYear(),b.getMonth(),b.getDate()) -
                       Date.UTC(a.getFullYear(),a.getMonth(),a.getDate()))/86400000);
  }
  function todayDate(){ var n=new Date(); return new Date(n.getFullYear(),n.getMonth(),n.getDate()); }
  function nowHM(){ var n=new Date(); return pad(n.getHours())+':'+pad(n.getMinutes()); }
  function fmtLong(d){ return d.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'}); }
  function fmtShort(d){ return pad(d.getDate())+'/'+pad(d.getMonth()+1); }
  function minutes(hm){ var p=hm.split(':').map(Number); return p[0]*60+p[1]; }

  var HEADER = '<header class="top"><img src="icon-180.png" alt=""><h1>Todo Dia</h1></header>';

  var PILLS = 21, PAUSE = 7, CYCLE = 28;

  function cycleInfo(date){
    var n = diffDays(parse(S.start), date);
    if (n < 0) return {before:true, daysTo:-n};
    var pos = ((n % CYCLE) + CYCLE) % CYCLE;
    var day = pos + 1;
    var cycleStart = addDays(date, -pos);
    return {
      before:false, pos:pos, day:day, isPill: day <= PILLS,
      cycleStart:cycleStart, nextStart:addDays(cycleStart, CYCLE),
      pauseDay: day - PILLS
    };
  }

  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

  function render(){
    if (document.getElementById('app').firstChild) captureUI();
    draw();
    restoreUI();
  }

  function draw(){
    var app = document.getElementById('app');
    if (!S.start) { app.innerHTML = setupHTML(); bindSetup(); return; }
    if (!S.time) S.time = '21:00';
    if (S.warn == null) S.warn = 5;
    S.log = S.log || {};

    if (UI.view === 'stats') { app.innerHTML = statsHTML(); bindStats(); return; }

    var today = todayDate();
    var info = cycleInfo(today);
    var html = HEADER;

    if (info.before) {
      html += '<section class="card hero"><div class="label">Cartela ainda não começou</div>' +
        '<div class="big">Começa em '+info.daysTo+(info.daysTo===1?' dia':' dias')+'</div>' +
        '<p class="sub">Primeira pílula em '+esc(fmtLong(parse(S.start)))+', às '+esc(S.time)+'.</p></section>';
      html += settingsHTML();
      app.innerHTML = html; bindSettings(); return;
    }

    var key = ymd(today);
    var took = S.log[key];
    var late = minutes(nowHM()) >= minutes(S.time);

    if (info.isPill) {
      html += '<section class="card hero">';
      html += '<div class="label">Dia '+info.day+' de '+PILLS+'</div>';
      if (took) {
        html += '<div class="big taken">✓ Tomada hoje</div>' +
                '<p class="sub">Registrada às '+esc(took.t)+'.</p>' +
                '<button class="btn ghost" id="undo">Desfazer</button>';
      } else {
        html += '<div class="big">Hoje às '+esc(S.time)+'</div>';
        if (late) {
          html += '<div class="banner" style="margin-bottom:12px">Já passou do horário. Você tomou?</div>';
        } else {
          html += '<p class="sub">Toque no botão quando tomar.</p>';
        }
        html += '<button class="btn" id="took">Tomei</button>';
      }
      html += '</section>';

      var left = PILLS - info.day;
      if (left <= S.warn) {
        var msg = left === 0 ? 'Hoje é a última pílula da cartela. Separe a próxima.'
                : 'Sua cartela acaba em '+left+(left===1?' dia':' dias')+'. Separe a próxima.';
        html += '<div class="banner warn">'+msg+'</div>';
      }
    } else {
      var daysToNext = diffDays(today, info.nextStart);
      html += '<section class="card hero">';
      html += '<div class="label">Pausa · dia '+info.pauseDay+' de '+PAUSE+'</div>';
      html += '<div class="big">Sem pílula hoje</div>';
      html += '<p class="sub" style="margin:0">' +
        (daysToNext===1 ? 'Amanhã você começa a nova cartela ('+esc(fmtLong(info.nextStart))+').'
                        : 'Nova cartela começa em '+daysToNext+' dias, '+esc(fmtLong(info.nextStart))+'.') +
        '</p></section>';
    }

    html += gridHTML(info, today);
    html += '<section class="card open-stats" id="go-stats" role="button" tabindex="0">' +
      '<div><strong>Minha evolução</strong><p class="note" style="margin:2px 0 0">Gráficos, cartelas e pílulas desde o início.</p></div>' +
      '<span class="arrow">›</span></section>';
    html += '<details class="card" id="forgot"><summary>Esqueci de tomar</summary>' +
      '<p class="note">O que fazer depende do seu remédio e de quantas horas ou pílulas passaram. ' +
      'Confira a bula ou pergunte ao seu ginecologista ou farmacêutico. ' +
      'Depois, toque no dia no calendário acima para registrar o que aconteceu.</p></details>';
    html += settingsHTML();

    app.innerHTML = html;
    var b = document.getElementById('took');
    if (b) b.onclick = function(){ S.log[key] = {t:nowHM()}; save(); render(); };
    var u = document.getElementById('undo');
    if (u) u.onclick = function(){ delete S.log[key]; save(); render(); };
    bindGrid(today);
    bindSettings();
    document.getElementById('go-stats').onclick = function(){ showView('stats'); };
  }

  function showView(v){
    captureUI();
    UI.view = v; UI.scroll = 0; saveUI();
    draw(); restoreUI(); window.scrollTo(0,0);
  }

  function gridHTML(info, today){
    var cells = '', taken = 0, expected = 0;
    for (var i=0;i<CYCLE;i++){
      var d = addDays(info.cycleStart, i);
      var k = ymd(d);
      var isPill = i < PILLS;
      var past = diffDays(d, today) >= 0;
      var afterStart = diffDays(parse(S.start), d) >= 0;
      var done = isPill && S.log[k];
      var isToday = diffDays(d, today) === 0;
      var missed = isPill && afterStart && !done && (diffDays(d, today) > 0);
      if (isPill && past && afterStart) { expected++; if (done) taken++; }
      var cls = 'cell ' + (isPill ? 'pill' : 'pause');
      if (done) cls += ' done';
      if (missed) cls += ' missed';
      if (isToday) cls += ' today';
      var tappable = isPill && past && afterStart;
      if (tappable) cls += ' tap';
      cells += '<div class="'+cls+'" '+(tappable?'data-date="'+k+'"':'')+' title="'+esc(fmtLong(d))+'">' +
               '<span>'+d.getDate()+'</span><span class="mark">'+(done?'✓':(missed?'!':''))+'</span></div>';
    }
    return '<section class="card"><strong>Esta cartela</strong>' +
      '<div class="grid">'+cells+'</div>' +
      '<div class="legend"><span><i style="background:var(--rose)"></i>Tomada</span>' +
      '<span><i style="background:var(--rose-soft)"></i>Pílula</span>' +
      '<span><i style="background:var(--pause)"></i>Pausa</span>' +
      '<span><i style="border:2px solid var(--warn)"></i>Sem registro</span></div>' +
      '<div class="stat"><span>Registradas até hoje</span><strong>'+taken+' de '+expected+'</strong></div>' +
      '<p class="note">Toque num dia que já passou para marcar ou desmarcar.</p></section>';
  }

  function bindGrid(){
    var els = document.querySelectorAll('.cell[data-date]');
    for (var i=0;i<els.length;i++){
      els[i].onclick = function(){
        var k = this.getAttribute('data-date');
        if (S.log[k]) delete S.log[k]; else S.log[k] = {t:'--:--'};
        save(); render();
      };
    }
  }

  function settingsHTML(){
    return '<details class="card" id="cfg"><summary>Ajustes e lembretes</summary>' +
      '<label for="s-start">Dia da 1ª pílula da cartela atual</label>' +
      '<input type="date" id="s-start" value="'+esc(S.start)+'">' +
      '<label for="s-time">Horário da pílula</label>' +
      '<input type="time" id="s-time" value="'+esc(S.time||'21:00')+'">' +
      '<label for="s-since">Comecei a usar este remédio em (opcional)</label>' +
      '<input type="date" id="s-since" value="'+esc(S.since||'')+'">' +
      '<label for="s-warn">Avisar quando faltarem quantos dias para acabar</label>' +
      '<input type="number" id="s-warn" min="1" max="10" value="'+esc(S.warn==null?5:S.warn)+'">' +
      '<div class="stack">' +
      '<button class="btn" id="ics">Adicionar lembretes ao Calendário</button>' +
      '<p class="note" style="margin:0">Cria alarmes diários para as próximas 6 cartelas (a pílula e uma segunda checagem 30 min depois), ' +
      'avisos de fim de cartela e de início da próxima. Se mudar o horário ou a data, gere de novo.</p>' +
      '<button class="btn ghost" id="bk-out">Salvar cópia de segurança</button>' +
      '<button class="btn ghost" id="bk-in">Restaurar cópia de segurança</button>' +
      '<input type="file" id="bk-file" class="file" accept=".json,application/json">' +
      '<button class="btn ghost danger" id="wipe">Apagar todos os dados</button>' +
      '</div></details>';
  }

  function bindSettings(){
    var st = document.getElementById('s-start'), tm = document.getElementById('s-time'),
        wn = document.getElementById('s-warn');
    if (!st) return;
    st.onchange = function(){ if (st.value){ S.start = st.value; save(); render(); openCfg(); } };
    tm.onchange = function(){ if (tm.value){ S.time = tm.value; save(); render(); openCfg(); } };
    var sc = document.getElementById('s-since');
    sc.onchange = function(){ S.since = sc.value || ''; save(); render(); };
    wn.onchange = function(){
      var v = parseInt(wn.value,10);
      if (v>=1 && v<=10){ S.warn = v; save(); render(); openCfg(); }
    };
    document.getElementById('ics').onclick = downloadICS;
    document.getElementById('bk-out').onclick = function(){
      download(new Blob([JSON.stringify(S)], {type:'application/json'}), 'todo-dia-backup.json');
    };
    var file = document.getElementById('bk-file');
    document.getElementById('bk-in').onclick = function(){ file.click(); };
    file.onchange = function(){
      var f = file.files && file.files[0]; if (!f) return;
      var r = new FileReader();
      r.onload = function(){
        try {
          var x = JSON.parse(r.result);
          if (!x || !x.start) throw 0;
          S = x; save(); render(); alert('Dados restaurados.');
        } catch(e){ alert('Esse arquivo não é uma cópia do Todo Dia.'); }
      };
      r.readAsText(f);
    };
    document.getElementById('wipe').onclick = function(){
      if (confirm('Apagar todos os dados deste app neste aparelho?')) {
        try { localStorage.removeItem(KEY); localStorage.removeItem(UIKEY); } catch(e){}
        S = {}; UI = {}; idbPut({}); draw();
      }
    };
  }
  function openCfg(){ var c=document.getElementById('cfg'); if (c) c.open = true; }

  function setupHTML(){
    var t = UI.draftStart || ymd(todayDate());
    return HEADER + '<section class="card">' +
      '<h2>Vamos configurar</h2>' +
      '<p class="note">Esquema: 21 dias de pílula e 7 de pausa. Seus dados ficam só neste aparelho.</p>' +
      '<label for="f-start">Em que dia você tomou (ou vai tomar) a 1ª pílula da cartela atual?</label>' +
      '<input type="date" id="f-start" value="'+t+'">' +
      '<label for="f-time">Que horas você toma?</label>' +
      '<input type="time" id="f-time" value="'+esc(UI.draftTime || '21:00')+'">' +
      '<div class="stack"><button class="btn" id="f-go">Começar</button></div></section>';
  }
  function bindSetup(){
    var fs = document.getElementById('f-start'), ft = document.getElementById('f-time');
    fs.onchange = function(){ UI.draftStart = fs.value; saveUI(); };
    ft.onchange = function(){ UI.draftTime = ft.value; saveUI(); };
    document.getElementById('f-go').onclick = function(){
      var s = document.getElementById('f-start').value, t = document.getElementById('f-time').value;
      if (!s || !t){ alert('Preencha a data e o horário.'); return; }
      S = {start:s, time:t, warn:5, log:{}}; delete UI.draftStart; delete UI.draftTime;
      saveUI(); save(); render();
    };
  }

  // ---------- Minha evolução ----------
  function stats(){
    var today = todayDate();
    var start = parse(S.start);
    var keys = Object.keys(S.log||{}).sort();
    // início do acompanhamento no app: a 1ª cartela configurada ou o 1º registro, o que vier antes
    var track = start;
    if (keys.length && diffDays(parse(keys[0]), track) > 0) track = parse(keys[0]);
    var since = S.since ? parse(S.since) : track;
    if (diffDays(since, track) < 0) since = track;

    function cycStart(d){
      var n = diffDays(start, d);
      return addDays(d, -(((n % CYCLE) + CYCLE) % CYCLE));
    }
    function isPillDay(d){ var n = diffDays(start, d); return (((n % CYCLE)+CYCLE)%CYCLE) < PILLS; }

    // cartelas acompanhadas no app
    var cycles = [], cs = cycStart(track);
    var taken = 0, expected = 0, times = [];
    while (diffDays(cs, today) >= 0) {
      var c = {start:cs, taken:0, expected:0, done:diffDays(addDays(cs, PILLS-1), today) > 0};
      for (var i=0;i<PILLS;i++){
        var d = addDays(cs, i), k = ymd(d), dt = diffDays(d, today);
        if (diffDays(track, d) < 0 || dt < 0) continue;
        var t = S.log[k];
        if (dt > 0 || t) { c.expected++; if (t) c.taken++; }
        if (t && t.t && t.t !== '--:--') times.push(minutes(t.t));
      }
      if (c.done && c.taken === PILLS) c.full = true;
      taken += c.taken; expected += c.expected;
      cycles.push(c);
      cs = addDays(cs, CYCLE);
    }
    // cartelas terminadas desde o início do uso (estimado pelo ciclo de 28 dias)
    var all = 0, cs2 = cycStart(since);
    while (diffDays(addDays(cs2, PILLS-1), today) > 0) { all++; cs2 = addDays(cs2, CYCLE); }

    // sequência atual: dias de pílula seguidos com registro (pausa não interrompe)
    var streak = 0, d0 = today;
    if (!isPillDay(d0) || !S.log[ymd(d0)]) d0 = addDays(d0, -1);
    for (var g=0; g<3650; g++){
      var dd0 = addDays(d0, -g);
      if (diffDays(track, dd0) < 0) break;
      if (!isPillDay(dd0)) continue;
      if (S.log[ymd(dd0)]) streak++; else break;
    }
    var best = 0, run = 0;
    for (var dd1 = track; diffDays(dd1, today) >= 0; dd1 = addDays(dd1, 1)){
      if (!isPillDay(dd1)) continue;
      if (S.log[ymd(dd1)]) { run++; if (run > best) best = run; }
      else if (diffDays(dd1, today) > 0) run = 0;
    }

    var onTime = 0, avg = null, target = minutes(S.time);
    if (times.length){
      var sum = 0;
      for (var j=0;j<times.length;j++){
        var diff = times[j] - target;
        if (diff > 720) diff -= 1440; if (diff < -720) diff += 1440;
        sum += diff;
        if (Math.abs(diff) <= 60) onTime++;
      }
      avg = (target + Math.round(sum/times.length) + 1440) % 1440;
    }
    return {since:since, track:track, days:diffDays(since, today), taken:taken, expected:expected,
            cycles:cycles, cartelas:all, streak:streak, best:best, times:times.length,
            onTime:onTime, avg:avg, total:keys.length};
  }

  function hm(m){ return pad(Math.floor(m/60))+':'+pad(m%60); }
  function pct(a,b){ return b ? Math.round(a*100/b) : 0; }
  function fmtDate(d){ return d.toLocaleDateString('pt-BR',{day:'numeric',month:'short',year:'numeric'}); }
  function plural(n, a, b){ return n+' '+(n===1?a:b); }

  function tenure(days){
    if (days < 31) return plural(days,'dia','dias');
    var m = Math.floor(days/30.44);
    if (m < 12) return plural(m,'mês','meses');
    var y = Math.floor(m/12), r = m%12;
    return plural(y,'ano','anos') + (r ? ' e '+plural(r,'mês','meses') : '');
  }

  function statsHTML(){
    var st = stats();
    var adh = pct(st.taken, st.expected);
    var h = '<header class="top"><img src="icon-180.png" alt=""><h1>Minha evolução</h1>' +
      '<button class="btn ghost small back" id="back">Voltar</button></header>';

    h += '<section class="card hero"><div class="label">Usando desde '+esc(fmtDate(st.since))+'</div>' +
      '<div class="hero-num">'+esc(tenure(st.days))+'</div>' +
      '<p class="sub" style="margin:0">'+plural(st.cartelas,'cartela terminada','cartelas terminadas')+
      (S.since ? ' desde que você começou' : ' desde que começou a usar o app')+'.</p></section>';

    h += '<div class="tiles">' +
      tile('Pílulas tomadas', st.total, 'registradas no app') +
      tile('Sequência atual', st.streak, st.streak===1?'dia seguido':'dias seguidos') +
      tile('Maior sequência', st.best, st.best===1?'dia':'dias') +
      tile('Horário médio', st.avg==null?'—':hm(st.avg), 'combinado: '+esc(S.time)) +
      '</div>';

    h += '<section class="card"><strong>Regularidade</strong>' +
      '<div class="hero-num" style="font-size:2.2rem">'+adh+'%</div>' +
      '<p class="note" style="margin:0">'+st.taken+' de '+st.expected+' pílulas esperadas foram registradas' +
      (st.times ? '; '+pct(st.onTime, st.times)+'% até 1 hora do horário combinado.' : '.')+'</p>' +
      '<div class="meter" role="img" aria-label="'+adh+'% registradas"><i style="width:'+adh+'%"></i></div></section>';

    h += chartHTML(st.cycles);
    h += '<p class="note" style="margin:0 4px">Os números contam só o que foi marcado no app. ' +
      'Para dizer desde quando você usa o remédio, preencha a data em Ajustes.</p>';
    return h;
  }

  function tile(k, v, s){
    return '<div class="tile"><div class="k">'+esc(k)+'</div><div class="v">'+esc(v)+'</div><div class="s">'+s+'</div></div>';
  }

  function chartHTML(cycles){
    var list = cycles.slice(-8);
    var W = 320, H = 150, top = 14, bottom = 22, left = 24, right = 4;
    var ph = H - top - bottom, pw = W - left - right;
    var slot = pw / Math.max(list.length, 1);
    var bw = Math.min(24, slot * 0.6);
    var svg = '<svg class="chart" id="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Pílulas registradas por cartela">';
    [0, 7, 14, 21].forEach(function(v){
      var y = top + ph - ph * v / PILLS;
      svg += '<line x1="'+left+'" x2="'+W+'" y1="'+y+'" y2="'+y+'" stroke="var(--grid)" stroke-width="1"/>' +
             '<text x="'+(left-6)+'" y="'+(y+4)+'" text-anchor="end">'+v+'</text>';
    });
    var rows = '';
    list.forEach(function(c, i){
      var n = cycles.length - list.length + i + 1;
      var x = left + slot*i + (slot-bw)/2, bh = ph * c.taken / PILLS, y = top + ph - bh, r = Math.min(4, bh);
      var path = bh > 0 ? 'M'+x+','+(top+ph)+'V'+(y+r)+'Q'+x+','+y+' '+(x+r)+','+y+'H'+(x+bw-r)+'Q'+(x+bw)+','+y+' '+(x+bw)+','+(y+r)+'V'+(top+ph)+'Z' : '';
      var cur = !c.done;
      var label = 'Cartela '+n+' ('+fmtShort(c.start)+'): '+c.taken+' de '+PILLS+(cur?' até agora':'');
      if (path) svg += '<path class="col'+(cur?' cur':'')+'" data-i="'+i+'" d="'+path+'"/>';
      svg += '<text x="'+(left+slot*i+slot/2)+'" y="'+(H-6)+'" text-anchor="middle">'+n+'</text>';
      svg += '<rect class="hit" data-i="'+i+'" data-label="'+esc(label)+'" x="'+(left+slot*i)+'" y="0" width="'+slot+'" height="'+H+'"><title>'+esc(label)+'</title></rect>';
      rows = '<tr><td>'+n+'</td><td>'+fmtShort(c.start)+' a '+fmtShort(addDays(c.start, PILLS-1))+'</td><td>'+c.taken+' de '+PILLS+(cur?' (atual)':'')+'</td></tr>' + rows;
    });
    svg += '</svg>';
    return '<section class="card"><strong>Pílulas por cartela</strong>' +
      '<p class="note" style="margin:2px 0 0">Toque numa barra para ver os detalhes. A barra clara é a cartela atual.</p>' +
      svg + '<div class="readout" id="readout"></div>' +
      '<details id="tbl"><summary style="font-weight:600;font-size:.92rem">Ver em tabela</summary>' +
      '<table class="t"><thead><tr><th>Cartela</th><th>Período</th><th>Tomadas</th></tr></thead><tbody>'+rows+'</tbody></table></details></section>';
  }

  function bindStats(){
    document.getElementById('back').onclick = function(){ showView('home'); };
    var chart = document.getElementById('chart'), out = document.getElementById('readout');
    if (!chart) return;
    var hits = chart.querySelectorAll('.hit');
    function pick(i, label){
      var cols = chart.querySelectorAll('.col');
      for (var j=0;j<cols.length;j++) cols[j].classList.toggle('sel', cols[j].getAttribute('data-i') === i);
      chart.classList.add('has-sel');
      out.textContent = label;
    }
    for (var k=0;k<hits.length;k++){
      hits[k].addEventListener('click', function(){ pick(this.getAttribute('data-i'), this.getAttribute('data-label')); });
      hits[k].addEventListener('mouseenter', function(){ pick(this.getAttribute('data-i'), this.getAttribute('data-label')); });
    }
    if (hits.length) { var last = hits[hits.length-1]; pick(last.getAttribute('data-i'), last.getAttribute('data-label')); }
  }

  // ---------- Calendário (.ics) ----------
  function dt(d, hm){
    var p = hm.split(':');
    return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'T'+p[0]+p[1]+'00';
  }
  function dd(d){ return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate()); }

  function buildICS(){
    var today = todayDate();
    var cs = parse(S.start);
    var n = diffDays(cs, today);
    if (n > 0) cs = addDays(today, -(((n % CYCLE)+CYCLE)%CYCLE));
    var L = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Todo Dia//PT','CALSCALE:GREGORIAN',
             'X-WR-CALNAME:Todo Dia'];
    var stamp = dt(new Date(), nowHM());
    function ev(uid, startLine, title, alarms){
      L.push('BEGIN:VEVENT','UID:'+uid+'@pilula-app','DTSTAMP:'+stamp,startLine,'SUMMARY:'+title);
      for (var i=0;i<alarms.length;i++){
        L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+alarms[i].text,'TRIGGER:'+alarms[i].trig,'END:VALARM');
      }
      L.push('END:VEVENT');
    }
    for (var c=0;c<6;c++){
      for (var i=0;i<CYCLE;i++){
        var d = addDays(cs, c*CYCLE+i);
        if (diffDays(today, d) < 0) continue;
        var day = i+1, left = PILLS - day;
        if (day <= PILLS){
          ev('pill-'+dd(d), 'DTSTART:'+dt(d,S.time)+'\r\nDURATION:PT5M',
             'Pílula (dia '+day+' de '+PILLS+')',
             [{text:'Hora da pílula',trig:'PT0S'},{text:'Você já tomou a pílula?',trig:'PT30M'}]);
        }
        if (day <= PILLS && left === S.warn){
          ev('end-'+dd(d), 'DTSTART;VALUE=DATE:'+dd(d), 'Cartela acabando: faltam '+left+' dias',
             [{text:'Separe a próxima cartela',trig:'PT9H'}]);
        }
        if (day === PILLS+1){
          ev('pause-'+dd(d), 'DTSTART;VALUE=DATE:'+dd(d), 'Pausa começa hoje (sem pílula)',
             [{text:'Sem pílula por 7 dias',trig:'PT9H'}]);
        }
        if (day === 1 && c > 0){
          ev('new-'+dd(d), 'DTSTART;VALUE=DATE:'+dd(d), 'Começa a nova cartela hoje',
             [{text:'Primeira pílula da nova cartela',trig:'PT9H'}]);
        }
      }
    }
    L.push('END:VCALENDAR');
    return L.join('\r\n');
  }

  function downloadICS(){
    download(new Blob([buildICS()], {type:'text/calendar;charset=utf-8'}), 'lembretes-pilula.ics');
  }
  function download(blob, name){
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  }

  // expõe para testes locais, sem efeito no uso normal
  window.__pilula = {cycleInfo:cycleInfo, buildICS:buildICS, setState:function(x){S=x;}};

  // Primeira abertura: se o localStorage foi apagado, tenta recuperar a cópia do IndexedDB.
  function start(){
    draw(); restoreUI();
    if (UI.scroll) setTimeout(function(){ window.scrollTo(0, UI.scroll); }, 0);
  }
  if (S.start) { start(); idbPut(S); }
  else idbGet(function(x){
    if (x && x.start) { S = x; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
    start();
  });
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}

  // Ao voltar para o app (mesmo dias depois), atualiza para a data de hoje mantendo onde parou.
  function resume(){
    var a = document.activeElement;
    if (a && a.tagName === 'INPUT') return;
    var y = window.scrollY;
    S = load().start ? load() : S;
    render();
    window.scrollTo(0, y);
  }
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'visible') resume();
    else { captureUI(); saveUI(); }
  });
  window.addEventListener('pageshow', function(e){ if (e.persisted) resume(); });
  window.addEventListener('pagehide', function(){ captureUI(); saveUI(); });
  var scrollT;
  window.addEventListener('scroll', function(){
    clearTimeout(scrollT);
    scrollT = setTimeout(function(){ UI.scroll = window.scrollY; saveUI(); }, 300);
  }, {passive:true});

  // atualiza o aviso de "já passou do horário" com o app aberto
  setInterval(function(){
    var a = document.activeElement;
    if (a && (a.tagName==='INPUT')) return;
    var y = window.scrollY;
    render();
    window.scrollTo(0, y);
  }, 60000);

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
})();
</script>
